version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freebase
      POSTGRES_PASSWORD: freebase
      POSTGRES_DB: freebase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freebase"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database — use bundled Postgres
      DATABASE_URL: "postgresql://freebase:freebase@postgres:5432/freebase?sslmode=disable"
      DATABASE_URL_UNPOOLED: "postgresql://freebase:freebase@postgres:5432/freebase?sslmode=disable"
      NODE_ENV: production

      # Copy these from your .env file:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}

      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      FREEBASE_API_SECRET: ${FREEBASE_API_SECRET}

      # Optional — leave blank to disable email features
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_DOMAIN: ${EMAIL_FROM_DOMAIN:-}

      # Optional — org slug to show live widget on marketing page
      NEXT_PUBLIC_WIDGET_DEMO_ORG: ${NEXT_PUBLIC_WIDGET_DEMO_ORG:-}

volumes:
  postgres_data:
